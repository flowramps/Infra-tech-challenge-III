name: cd

# Push-based deploys cannot reach a local (or private) cluster. This pipeline
# only publishes artifacts and records the new version in Git; Argo CD, running
# inside the cluster, pulls the change and rolls it out.
on:
  push:
    branches: [main]
    paths: ["app/**"]
  workflow_dispatch:

# A release is never cancelled halfway (image pushed but tag not bumped).
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write     # commit the new image tag
  packages: write     # push to GHCR
  id-token: write     # keyless signing of the provenance attestation
  attestations: write

jobs:
  release:
    name: Build, scan, publish and bump
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Image coordinates
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/sample-app" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          load: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Release gate: a CRITICAL vulnerability with a published fix never
      # reaches the registry. Unfixed CVEs are reported by security.yml.
      - name: Security gate (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha

      # Signed SLSA provenance: proves the image was built by this workflow
      # from this commit. Verify with: gh attestation verify oci://<image> -R <repo>
      - name: Provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Commits made with GITHUB_TOKEN do not trigger new workflow runs, so the
      # bump cannot start a release loop.
      - name: Bump image tag in Git
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAG: ${{ steps.image.outputs.tag }}
          VALUES: terraform/modules/sample-app/chart/values.yaml
        run: |
          yq -i '.image.repository = strenv(IMAGE) | .image.tag = strenv(TAG)' "$VALUES"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(sample-app): ${TAG}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
