{{- range $svc := .Values.services }}
{{- range $v := $svc.versions }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svc.name }}-{{ $v.name }}
  labels:
    {{- include "sample-app.labels" (dict "root" $) | nindent 4 }}
    {{- include "sample-app.podLabels" (dict "name" $svc.name "version" $v.name) | nindent 4 }}
spec:
  # Replica count is owned by the HorizontalPodAutoscaler.
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: {{ $svc.name }}
      version: {{ $v.name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "sample-app.labels" (dict "root" $) | nindent 8 }}
        {{- include "sample-app.podLabels" (dict "name" $svc.name "version" $v.name) | nindent 8 }}
      annotations:
        # Prometheus is outside the mesh: the metrics port bypasses the sidecar
        # so it can be scraped in plain HTTP while business traffic stays mTLS.
        traffic.sidecar.istio.io/excludeInboundPorts: "9464"
        # Spans go straight to Tempo (outside the mesh); otherwise Envoy would
        # trace the telemetry export itself and pollute the traces.
        traffic.sidecar.istio.io/excludeOutboundPorts: "4317"
    spec:
      serviceAccountName: {{ $svc.name }}
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: {{ $svc.name }}
              version: {{ $v.name }}
      containers:
        - name: app
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9464
          env:
            - name: SERVICE_NAME
              value: {{ $svc.name | quote }}
            - name: SERVICE_VERSION
              value: {{ $v.name | quote }}
            - name: DOWNSTREAMS
              value: {{ join "," ($svc.downstreams | default list) | quote }}
            - name: LATENCY_MS
              value: {{ $v.latencyMs | default $svc.latencyMs | quote }}
            - name: FAULT_RATE
              value: {{ ternary $.Values.faultRate 0 (default false $svc.injectFaults) | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $.Values.otlpEndpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.namespace.name={{ $.Release.Namespace }}"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
{{- end }}
{{- end }}
