{{- range $svc := .Values.services }}
{{- range $v := $svc.versions }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $svc.name }}-{{ $v.name }}
  labels:
    {{- include "sample-app.labels" (dict "root" $) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $svc.name }}-{{ $v.name }}
  minReplicas: {{ $v.replicas }}
  maxReplicas: {{ mul $v.replicas $.Values.autoscaling.maxReplicasFactor }}
  metrics:
    # Only the application container counts; the Envoy sidecar is ignored.
    - type: ContainerResource
      containerResource:
        name: cpu
        container: app
        target:
          type: Utilization
          averageUtilization: {{ $.Values.autoscaling.targetCPUUtilization }}
{{- end }}
{{- end }}
