apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: sample-app
  labels:
    {{- include "sample-app.labels" (dict "root" $) | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: sample-app
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 15s
