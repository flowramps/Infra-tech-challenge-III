# Updated by the CD pipeline (.github/workflows/cd.yml) on every release.
image:
  repository: ghcr.io/flowramps/infra-tech-challenge-iii/sample-app
  tag: ef745e9e5475
  pullPolicy: IfNotPresent
# OTLP/gRPC endpoint for application spans.
otlpEndpoint: http://tempo.monitoring.svc.cluster.local:4317
# Percentage of orders traffic sent to the v2 canary.
canaryWeight: 10
# Fraction of inventory requests that fail on purpose.
faultRate: 0.02
services:
  - name: frontend
    downstreams: ["http://orders:8080/"]
    latencyMs: 15
    allowedCallers: [loadgen]
    allowIngressGateway: true
    versions:
      - name: v1
        replicas: 2
  - name: orders
    downstreams: ["http://inventory:8080/"]
    latencyMs: 25
    allowedCallers: [frontend]
    versions:
      - name: v1
        replicas: 2
      - name: v2
        replicas: 1
        canary: true
        latencyMs: 40
  - name: inventory
    latencyMs: 30
    injectFaults: true
    allowedCallers: [orders]
    # Retries and circuit breaking apply to calls made to this service.
    retries:
      attempts: 3
      perTryTimeout: 1s
      retryOn: 5xx,reset,connect-failure,retriable-status-codes
    versions:
      - name: v1
        replicas: 2
autoscaling:
  maxReplicasFactor: 3
  targetCPUUtilization: 70
resources:
  requests: {cpu: 50m, memory: 96Mi}
  limits: {cpu: 500m, memory: 256Mi}
trafficPolicy:
  connectionPool:
    tcp:
      maxConnections: 100
    http:
      http1MaxPendingRequests: 50
      maxRequestsPerConnection: 20
  outlierDetection:
    consecutive5xxErrors: 5
    interval: 10s
    baseEjectionTime: 30s
    maxEjectionPercent: 50
loadgen:
  enabled: true
  image: curlimages/curl:8.16.0
  # Requests per second sent to the frontend.
  intervalSeconds: 0.2
slo:
  # 99.5% of requests succeed (non 5xx).
  availability: 0.995
  # 99% of requests complete within latencyThreshold seconds.
  latency: 0.99
  latencyThreshold: "0.5"
network:
  monitoringNamespace: monitoring
  ingressNamespace: istio-ingress
# Published through the shared gateway created by the service-mesh module.
ingress:
  gateway: istio-ingress/platform
  host: app.localhost
