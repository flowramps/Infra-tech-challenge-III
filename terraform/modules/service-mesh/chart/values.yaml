tracing:
  # Name of the extension provider declared in istiod meshConfig.
  provider: tempo
  samplingPercentage: 100

mtls:
  mode: STRICT

# Shared HTTP entry point. Workloads attach their own VirtualServices to it;
# the platform UIs are listed here.
ingress:
  namespace: istio-ingress
  selector:
    istio: ingress
  routes: []
